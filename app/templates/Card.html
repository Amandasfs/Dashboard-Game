<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carta de Pergunta - Pixel Game</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Press Start 2P', cursive;
    background: url('https://art.pixilart.com/sr5z97b2266c6daws3.png') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    min-height: 100vh;
    image-rendering: pixelated;
}
button { cursor: pointer; }

.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.modal-overlay.active { display: flex; }

.card-box {
    background: rgba(0,0,0,0.85);
    border: 4px solid #00d0ff;
    border-radius: 12px;
    padding: 30px;
    width: 400px;
    max-width: 90%;
    position: relative;
    box-shadow: 0 0 20px #00d0ff, inset 0 0 15px rgba(0,208,255,0.3);
    animation: card-glow 3s infinite;
}

.card-box::before {
    content: '';
    position: absolute;
    top: -10px; left: -10px; right: -10px; bottom: -10px;
    border: 2px solid #00d0ff; border-radius: 16px; z-index: -1; opacity: 0.5;
}

@keyframes card-glow {
    0% { box-shadow: 0 0 20px #00d0ff, inset 0 0 15px rgba(0,208,255,0.3); }
    50% { box-shadow: 0 0 30px #00d0ff, 0 0 40px #00d0ff, inset 0 0 15px rgba(0,208,255,0.5); }
    100% { box-shadow: 0 0 20px #00d0ff, inset 0 0 15px rgba(0,208,255,0.3); }
}

.card-box .close-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: #ff6b6b;
    border: none;
    color: #fff;
    font-size: 14px;
    padding: 5px 10px;
    border-radius: 6px;
}

.turn, .question, .options-box, .timer, .feedback {
    margin-bottom: 20px;
}

/* Reaproveita suas classes de opções e feedback aqui */
</style>
</head>
<body>

<!-- Botão para testar abertura -->
<button onclick="abrirCarta()">Puxar Carta</button>

<!-- Modal -->
<div id="cardModal" class="modal-overlay">
    <div class="card-box">
        <button class="close-btn" onclick="fecharCarta()">X</button>
        <p id="playerTurn" class="turn">Vez de: Carregando...</p>
        <p id="question" class="question">Carregando pergunta...</p>
        <div id="optionsContainer" class="options-box"></div>
        <p id="timer" class="timer">⏳ 60s</p>
        <div id="feedback" class="feedback"></div>
    </div>
</div>

<script type="module">
const cardModal = document.getElementById('cardModal');

window.abrirCarta = function() {
    cardModal.classList.add('active');
}

window.fecharCarta = function() {
    cardModal.classList.remove('active');
}

// Aqui você conecta o Socket.IO e renderiza a carta normalmente
// Exemplo resumido:
import { initSocket } from "./js/socket.js";

const socket = initSocket("game_code_exemplo", "Player1", 1);

// Recebe pergunta e atualiza modal
socket.on("nova_pergunta", (data) => {
    document.getElementById('playerTurn').textContent = `Vez de: ${data.player}`;
    document.getElementById('question').textContent = data.question;
    const optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = "";
    data.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.textContent = opt;
        btn.onclick = () => {
            socket.emit("responder_pergunta", {
                game_code: "game_code_exemplo",
                player: "Player1",
                resposta: idx,
                carta: data
            });
            fecharCarta();
        }
        optionsContainer.appendChild(btn);
    });
    abrirCarta();
});
</script>

</body>
</html>
