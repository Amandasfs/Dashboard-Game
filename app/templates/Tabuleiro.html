<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tabuleiro - Pixel Game</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tabuleiro.css">
</head>
<body>
<div class="game-container">
    <!-- HEADER -->
    <div class="game-header">
        <h1 class="game-title">🎮 TABULEIRO DO JOGO</h1>
        <div class="turn-info" id="turnInfo">Carregando partida...</div>
    </div>

    <!-- TABULEIRO -->
    <div class="board-container">
        <div class="board" id="board"></div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <!-- CARTA ATUAL -->
        <div class="card-area">
            <h2 class="card-title">🃏 CARTA ATUAL</h2>
            <div class="card-display" id="cardText">Nenhuma carta puxada ainda...</div>
            <button class="btn-pixel" id="drawCardBtn">🎴 PUXAR CARTA</button>
        </div>

        <!-- JOGADORES -->
        <div class="players-info">
            <h3 class="card-title">👥 JOGADORES</h3>
            <div id="playersList"></div>
        </div>
    </div>
</div>

<!-- MODAL DE CARTA -->
<div id="cardModal" class="modal-overlay">
    <div class="card-box">
        <div id="cardQuestion">Carregando pergunta...</div>
        <div id="cardOptions"></div>
        <button id="closeCard" class="btn-pixel">Fechar</button>
    </div>
</div>

<script type="module" src="/static/js/tabuleiro.js"></script>
</body>
</html>
